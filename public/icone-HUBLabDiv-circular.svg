<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Background for Browser Favicons / Tabs -->

  <!-- Cap Group (Transparent Background, Shifted 30px Right, 1.42x Scale) -->
  <g transform="translate(286, 256) scale(1.42) translate(-256, -306.5)">
    <defs>
      <!-- Horizontal Smooth Gradient for Cap Top Surface with Highlights -->
      <linearGradient id="capTopGradientCircTab" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0E4277" />
        <stop offset="22%" stop-color="#0F4780" />
        <stop offset="48%" stop-color="#F14343" />
        <stop offset="78%" stop-color="#FFCC00" />
        <stop offset="100%" stop-color="#FCE055" />
      </linearGradient>

      <!-- Horizontal Gradient for Skull Cap Base Ring -->
      <linearGradient id="capBaseGradientCircTab" x1="5%" y1="0%" x2="95%" y2="0%">
        <stop offset="0%" stop-color="#0B3764" />
        <stop offset="25%" stop-color="#0F4780" />
        <stop offset="50%" stop-color="#F14343" />
        <stop offset="80%" stop-color="#FFCC00" />
        <stop offset="100%" stop-color="#E5B800" />
      </linearGradient>
    </defs>

    <!-- ================= CAP BASE (CILINDRO / ANEL INFERIOR) ================= -->
    <g>
      <!-- Base Cylinder Fill -->
      <path d="M 126 310 L 126 385 C 126 425, 386 425, 386 385 L 386 310 Z"
            fill="url(#capBaseGradientCircTab)" />

      <!-- Shadow Cast by Top Hat onto Base -->
      <path d="M 126 310 L 126 338 L 256 390 L 386 338 L 386 310 Z"
            fill="#000000"
            opacity="0.3" />

      <!-- Base Cylinder Stroke -->
      <path d="M 126 310 L 126 385 C 126 425, 386 425, 386 385 L 386 310 Z"
            fill="none"
            stroke="#000000"
            stroke-width="8"
            stroke-linejoin="round" />
    </g>

    <!-- ================= CAP ISOMETRIC DIAMOND TOP (SURFACE) ================= -->
    <g>
      <!-- Main Diamond Surface Path -->
      <path d="M 256 165
               L 476 270
               L 256 375
               L 36 270
               Z"
            fill="url(#capTopGradientCircTab)"
            stroke="#000000"
            stroke-width="8"
            stroke-linejoin="round"
            stroke-linecap="round" />

      <!-- Top Bevel Highlight -->
      <path d="M 52 272 L 256 173 L 460 272"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="6"
            stroke-linecap="round"
            opacity="0.3" />
    </g>

    <!-- ================= TASSEL (CORDÃO E BORLA NO CANTO ESQUERDO) ================= -->
    <g stroke-linejoin="round" stroke-linecap="round">
      <!-- Cord Shadow -->
      <path d="M 72 286 L 72 339" stroke="#000000" stroke-width="10" opacity="0.4" />
      
      <!-- Cord Hanging from Left Top Edge -->
      <path d="M 70 286 L 70 335" stroke="#000000" stroke-width="10" />
      <path d="M 70 276 L 70 335" stroke="#0F4780" stroke-width="6" />

      <!-- Tassel Ring Bead -->
      <circle cx="70" cy="347" r="12" fill="#0F4780" stroke="#000000" stroke-width="4" />

      <!-- Tassel Skirt Fringe -->
      <path d="M 56 363 L 42 446 Q 70 460 98 446 L 84 363 Z"
            fill="#0F4780"
            stroke="#000000"
            stroke-width="8" />
    </g>
  </g>
</svg>
