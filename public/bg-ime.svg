<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" fill="none">
  <!-- Math & Computer Science Equations & Symbols -->
  <text x="80" y="60" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-12 80 60)">e^{iπ} + 1 = 0</text>
  <text x="650" y="120" fill="#F14343" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(8 650 120)">∀ ε &gt; 0, ∃ δ &gt; 0</text>
  <text x="1020" y="80" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-5 1020 80)">P ≠ NP</text>
  <text x="350" y="200" fill="#FFCC00" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(15 350 200)">lim_{x → ∞}</text>
  <text x="900" y="250" fill="#0F4780" opacity="1" font-size="24" font-family="Georgia, serif" transform="rotate(-8 900 250)">A ∩ B = ∅</text>
  <text x="150" y="340" fill="#F14343" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(6 150 340)">O(n log n)</text>
  <text x="550" y="380" fill="#0F4780" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(-10 550 380)">det(A) ≠ 0</text>
  <text x="1050" y="400" fill="#FFCC00" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(12 1050 400)">f(x) = ∑ a_n x^n</text>
  <text x="80" y="500" fill="#FFCC00" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(-6 80 500)">01101001</text>
  <text x="400" y="550" fill="#F14343" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(9 400 550)">P(A|B) = P(B|A)P(A)/P(B)</text>
  <text x="750" y="520" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-15 750 520)">∫₀^∞ e^{-x²} dx = √π/2</text>
  <text x="200" y="680" fill="#0F4780" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(4 200 680)">λ v = A v</text>
  <text x="600" y="720" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-7 600 720)">G = (V, E)</text>
  <text x="1000" y="650" fill="#F14343" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(11 1000 650)">ℵ₀</text>
  <text x="100" y="850" fill="#F14343" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(-9 100 850)">x ↦ f(x)</text>
  <text x="480" y="900" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(7 480 900)">E[X] = μ</text>
  <text x="850" y="870" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-13 850 870)">∇ f(x) = 0</text>
  <text x="300" y="1050" fill="#FFCC00" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(5 300 1050)">√2 ∉ ℚ</text>
  <text x="700" y="1080" fill="#F14343" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(-8 700 1080)">λ x. x x</text>
  <text x="1080" y="1000" fill="#0F4780" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(10 1080 1000)">∀ x ∈ ℝ</text>
  <text x="50" y="1150" fill="#0F4780" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-4 50 1150)">π ≈ 3.14159</text>
  <text x="550" y="1150" fill="#F14343" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(14 550 1150)">101011</text>
  <text x="950" y="1150" fill="#FFCC00" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-11 950 1150)">A ∪ B</text>

