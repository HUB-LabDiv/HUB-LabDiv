<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Brand Gradient for Text -->
    <linearGradient id="brandTextGradGraphic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F4780" />
      <stop offset="48%" stop-color="#F14343" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>

    <!-- Gradients for Cap -->
    <linearGradient id="capTopGradientFeature" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E4277" />
      <stop offset="22%" stop-color="#0F4780" />
      <stop offset="48%" stop-color="#F14343" />
      <stop offset="78%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#FCE055" />
    </linearGradient>

    <linearGradient id="capBaseGradientFeature" x1="5%" y1="0%" x2="95%" y2="0%">
      <stop offset="0%" stop-color="#0B3764" />
      <stop offset="25%" stop-color="#0F4780" />
      <stop offset="50%" stop-color="#F14343" />
      <stop offset="80%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#E5B800" />
    </linearGradient>
  </defs>

  <!-- Base Dark Background (#121212) -->
  <rect width="1024" height="500" fill="#121212" />

  <!-- High-Contrast Science Pattern Background -->
  <g opacity="0.85" transform="scale(0.8533)">
    <!-- Equations & Formulas -->
    <text x="80" y="60" fill="#4B90E2" font-size="24" font-family="Georgia, serif" font-weight="bold" transform="rotate(-12 80 60)">E = mc²</text>
    <text x="650" y="120" fill="#FF5252" font-size="20" font-family="Georgia, serif" font-weight="bold" transform="rotate(8 650 120)">∂ψ/∂t</text>
    <text x="1020" y="80" fill="#FFD740" font-size="18" font-family="Georgia, serif" font-weight="bold" transform="rotate(-5 1020 80)">ℏ</text>
    <text x="350" y="200" fill="#FFD740" font-size="22" font-family="Georgia, serif" font-weight="bold" transform="rotate(15 350 200)">∇×B</text>
    <text x="900" y="250" fill="#4B90E2" font-size="28" font-family="Georgia, serif" font-weight="bold" transform="rotate(-8 900 250)">∫</text>
    <text x="150" y="340" fill="#FF5252" font-size="18" font-family="Georgia, serif" font-weight="bold" transform="rotate(6 150 340)">λ = h/p</text>
    <text x="550" y="380" fill="#4B90E2" font-size="22" font-family="Georgia, serif" font-weight="bold" transform="rotate(-10 550 380)">Σ</text>
    <text x="1050" y="400" fill="#FFD740" font-size="16" font-family="Georgia, serif" font-weight="bold" transform="rotate(12 1050 400)">ΔxΔp ≥ ℏ/2</text>
    <text x="80" y="500" fill="#FFD740" font-size="24" font-family="Georgia, serif" font-weight="bold" transform="rotate(-6 80 500)">π</text>
    <text x="400" y="550" fill="#FF5252" font-size="20" font-family="Georgia, serif" font-weight="bold" transform="rotate(9 400 550)">F = ma</text>
    <text x="750" y="520" fill="#4B90E2" font-size="24" font-family="Georgia, serif" font-weight="bold" transform="rotate(-15 750 520)">∂²u/∂t²</text>
    <text x="200" y="680" fill="#4B90E2" font-size="20" font-family="Georgia, serif" font-weight="bold" transform="rotate(4 200 680)">∮ E·dl</text>
    <text x="600" y="720" fill="#FFD740" font-size="20" font-family="Georgia, serif" font-weight="bold" transform="rotate(-7 600 720)">ψ(x,t)</text>
    <text x="1000" y="650" fill="#FF5252" font-size="24" font-family="Georgia, serif" font-weight="bold" transform="rotate(11 1000 650)">iℏ∂ψ/∂t = Ĥψ</text>

    <!-- Particles -->
    <circle cx="120" cy="130" r="2.5" fill="#4B90E2" opacity="0.9"/>
    <circle cx="450" cy="90" r="2" fill="#FF5252" opacity="0.9"/>
    <circle cx="780" cy="170" r="3" fill="#FFD740" opacity="0.9"/>
    <circle cx="300" cy="300" r="2" fill="#FFD740" opacity="0.9"/>
    <circle cx="950" cy="330" r="2.5" fill="#4B90E2" opacity="0.9"/>
    <circle cx="600" cy="450" r="2" fill="#FF5252" opacity="0.9"/>
    <circle cx="160" cy="600" r="3" fill="#4B90E2" opacity="0.9"/>
    <circle cx="500" cy="650" r="2" fill="#FFD740" opacity="0.9"/>
    <circle cx="850" cy="580" r="2.5" fill="#FF5252" opacity="0.9"/>

    <!-- Atoms -->
    <ellipse cx="250" cy="450" rx="22" ry="7" fill="none" stroke="#4B90E2" stroke-width="1.2" opacity="0.85" transform="rotate(30 250 450)"/>
    <ellipse cx="250" cy="450" rx="22" ry="7" fill="none" stroke="#FF5252" stroke-width="1.2" opacity="0.85" transform="rotate(-30 250 450)"/>
    <circle cx="250" cy="450" r="3" fill="#FFD740" opacity="0.9"/>

    <ellipse cx="850" cy="350" rx="20" ry="6" fill="none" stroke="#FFD740" stroke-width="1.2" opacity="0.85" transform="rotate(20 850 350)"/>
    <ellipse cx="850" cy="350" rx="20" ry="6" fill="none" stroke="#4B90E2" stroke-width="1.2" opacity="0.85" transform="rotate(-40 850 350)"/>
    <circle cx="850" cy="350" r="3" fill="#FF5252" opacity="0.9"/>
  </g>

  <!-- ================= LEFT SIDE: HUB LOGO (CAP + WAVES) (Moved Left) ================= -->
  <g transform="translate(15, 25) scale(0.85)">
    <!-- Base Cylinder -->
    <g>
      <path d="M 126 310 L 126 385 C 126 425, 386 425, 386 385 L 386 310 Z" fill="url(#capBaseGradientFeature)" />
      <path d="M 126 310 L 126 338 L 256 390 L 386 338 L 386 310 Z" fill="#000000" opacity="0.3" />
      <path d="M 126 310 L 126 385 C 126 425, 386 425, 386 385 L 386 310 Z" fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
    </g>

    <!-- Diamond Top Surface -->
    <g>
      <path d="M 256 165 L 476 270 L 256 375 L 36 270 Z" fill="url(#capTopGradientFeature)" stroke="#000000" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
      <path d="M 52 272 L 256 173 L 460 272" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3" />
    </g>

    <!-- Tassel -->
    <g stroke-linejoin="round" stroke-linecap="round">
      <path d="M 72 286 L 72 339" stroke="#000000" stroke-width="10" opacity="0.4" />
      <path d="M 70 286 L 70 335" stroke="#000000" stroke-width="10" />
      <path d="M 70 276 L 70 335" stroke="#0F4780" stroke-width="6" />
      <circle cx="70" cy="347" r="12" fill="#0F4780" stroke="#000000" stroke-width="4" />
      <path d="M 56 363 L 42 446 Q 70 460 98 446 L 84 363 Z" fill="#0F4780" stroke="#000000" stroke-width="8" />
    </g>

    <!-- Signal Waves -->
    <g stroke-linecap="round" fill="none">
      <path d="M 53 225 C 27 168 27 104 53 50" stroke="#0F4780" stroke-width="26" opacity="0.3" />
      <path d="M 53 225 C 27 168 27 104 53 50" stroke="#000000" stroke-width="8" />
      <path d="M 53 225 C 27 168 27 104 53 50" stroke="#0F4780" stroke-width="10" />
      
      <path d="M 94 196 C 72 157 72 109 94 72" stroke="#0F4780" stroke-width="26" opacity="0.3" />
      <path d="M 94 196 C 72 157 72 109 94 72" stroke="#000000" stroke-width="8" />
      <path d="M 94 196 C 72 157 72 109 94 72" stroke="#0F4780" stroke-width="10" />

      <path d="M 138 183 C 120 153 120 118 138 88" stroke="#F14343" stroke-width="26" opacity="0.3" />
      <path d="M 138 183 C 120 153 120 118 138 88" stroke="#000000" stroke-width="8" />
      <path d="M 138 183 C 120 153 120 118 138 88" stroke="#F14343" stroke-width="10" />

      <path d="M 178 165 C 164 145 164 125 178 105" stroke="#F14343" stroke-width="26" opacity="0.3" />
      <path d="M 178 165 C 164 145 164 125 178 105" stroke="#000000" stroke-width="8" />
      <path d="M 178 165 C 164 145 164 125 178 105" stroke="#F14343" stroke-width="10" />

      <path d="M 210 110 C 235 92 277 92 302 110" stroke="#F14343" stroke-width="26" opacity="0.3" />
      <path d="M 210 110 C 235 92 277 92 302 110" stroke="#000000" stroke-width="10" />
      <path d="M 210 110 C 235 92 277 92 302 110" stroke="#F14343" stroke-width="10" />

      <path d="M 224 128 C 242 114 270 114 288 128" stroke="#F14343" stroke-width="26" opacity="0.3" />
      <path d="M 224 128 C 242 114 270 114 288 128" stroke="#000000" stroke-width="10" />
      <path d="M 224 128 C 242 114 270 114 288 128" stroke="#F14343" stroke-width="10" />

      <path d="M 238 146 C 248 136 264 136 274 146" stroke="#F14343" stroke-width="22" opacity="0.3" />
      <path d="M 238 146 C 248 136 264 136 274 146" stroke="#000000" stroke-width="8" />
      <path d="M 238 146 C 248 136 264 136 274 146" stroke="#F14343" stroke-width="9" />

      <path d="M 334 165 C 348 145 348 125 334 105" stroke="#F14343" stroke-width="26" opacity="0.3" />
      <path d="M 334 165 C 348 145 348 125 334 105" stroke="#000000" stroke-width="8" />
      <path d="M 334 165 C 348 145 348 125 334 105" stroke="#F14343" stroke-width="10" />

      <path d="M 374 183 C 392 153 392 118 374 88" stroke="#F14343" stroke-width="26" opacity="0.3" />
      <path d="M 374 183 C 392 153 392 118 374 88" stroke="#000000" stroke-width="8" />
      <path d="M 374 183 C 392 153 392 118 374 88" stroke="#F14343" stroke-width="10" />

      <path d="M 418 196 C 440 157 440 109 418 72" stroke="#FFCC00" stroke-width="26" opacity="0.3" />
      <path d="M 418 196 C 440 157 440 109 418 72" stroke="#000000" stroke-width="8" />
      <path d="M 418 196 C 440 157 440 109 418 72" stroke="#FFCC00" stroke-width="10" />

      <path d="M 459 225 C 485 168 485 104 459 50" stroke="#FFCC00" stroke-width="26" opacity="0.3" />
      <path d="M 459 225 C 485 168 485 104 459 50" stroke="#000000" stroke-width="8" />
      <path d="M 459 225 C 485 168 485 104 459 50" stroke="#FFCC00" stroke-width="10" />
    </g>
  </g>

  <!-- ================= RIGHT SIDE: BRAND TEXT + SUBTITLE (Moved Left to X=430) ================= -->
  <g transform="translate(430, 255)">
    <!-- HUB LabDiv -->
    <text font-family="'29LT Bukra', 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="96">
      <tspan fill="#FFFFFF" x="0" y="0">HUB</tspan>
      <tspan fill="url(#brandTextGradGraphic)" dx="20" y="0">LabDiv</tspan>
    </text>

    <!-- Subtitle below -->
    <text x="5" y="50" fill="#E0E0E0" font-family="'Open Sans', sans-serif" font-weight="600" font-size="21" letter-spacing="0.5" opacity="0.9">
      Hub de Comunicação Científica do LabDiv
    </text>
  </g>
</svg>
