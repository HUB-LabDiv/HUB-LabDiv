    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        @font-face {
            font-family: '29LT Bukra';
            src: local('29LT Bukra Semi Wide Bold'), local('29LT Bukra Bold'), local('29LTBukra-Bold'),
                 url('../fonts/Outfit-Black.ttf') format('truetype');
            font-weight: 700 900;
            font-display: swap;
        }
        .font-bukra { font-family: '29LT Bukra', 'Outfit', sans-serif; }
        .font-open-sans { font-family: 'Open Sans', sans-serif; }

        body {
            background-color: #FFFFFF;
            width: 2480px;
            height: 3508px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #000000;
        }

        .a4-sheet {
            width: 2480px;
            height: 3508px;
            background: #FFFFFF;
            padding: 130px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 120px;
            box-sizing: border-box;
        }

        .sticker {
            border: 18px solid #000000;
            border-radius: 95px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 65px;
            padding: 60px 50px;
            box-sizing: border-box;
            background: #FFFFFF;
            color: #000000;
            position: relative;
        }

        .sticker-title {
            font-size: 118px;
            font-weight: 900;
            text-align: center;
            line-height: 1.12;
            color: #000000;
            letter-spacing: -1.2px;
        }

        .qr-wrapper {
            position: relative;
            width: 830px;
            height: 830px;
            background: #FFFFFF;
            padding: 26px;
            border-radius: 68px;
            border: 18px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .qr-svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-svg-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-center-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: #FFFFFF;
            border: 9px solid #000000;
            border-radius: 42px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
        }

        .qr-center-badge svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
