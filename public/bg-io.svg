<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" fill="none">
  <!-- Oceanography & Marine Sciences Equations & Symbols (No Emojis, Pure Math & Blackboard Sketches) -->
  <text x="80" y="60" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-12 80 60)">S = 35 psu (Salinity)</text>
  <text x="650" y="120" fill="#F14343" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(8 650 120)">f = 2Ω sin φ (Coriolis)</text>
  <text x="1020" y="80" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-5 1020 80)">c = √(gh)</text>
  <text x="350" y="200" fill="#FFCC00" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(15 350 200)">ρ(S, T, p)</text>
  <text x="900" y="250" fill="#0F4780" opacity="1" font-size="24" font-family="Georgia, serif" transform="rotate(-8 900 250)">∂u/∂t + (u·∇)u = -1/ρ ∇p + f×u</text>
  <text x="150" y="340" fill="#F14343" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(6 150 340)">ω² = gk tanh(kh)</text>
  <text x="550" y="380" fill="#0F4780" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(-10 550 380)">Ek = ν / (f D²)</text>
  <text x="1050" y="400" fill="#FFCC00" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(12 1050 400)">τ_w = ρ_a C_D U₁₀²</text>
  <text x="80" y="500" fill="#FFCC00" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(-6 80 500)">Ro = U / (f L)</text>
  <text x="400" y="550" fill="#F14343" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(9 400 550)">∇ · u = 0 (Incompressibility)</text>
  <text x="750" y="520" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-15 750 520)">pH = 8.1 / Ω_{arag}</text>
  <text x="200" y="680" fill="#0F4780" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(4 200 680)">H_s = 4 √(m₀)</text>
  <text x="600" y="720" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-7 600 720)">A_T = 2.3 mmol/kg</text>
  <text x="1000" y="650" fill="#F14343" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(11 1000 650)">Bathymetry 4000m</text>
  <text x="100" y="850" fill="#F14343" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(-9 100 850)">∂ρ/∂t + u · ∇ρ = K_z ∂²ρ/∂z²</text>
  <text x="480" y="900" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(7 480 900)">Re = U d / ν</text>
  <text x="850" y="870" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-13 850 870)">T = 15°C (Thermocline)</text>
  <text x="300" y="1050" fill="#FFCC00" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(5 300 1050)">N² = -(g/ρ) ∂ρ/∂z</text>
  <text x="700" y="1080" fill="#F14343" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(-8 700 1080)">λ = 2π / k</text>
  <text x="1080" y="1000" fill="#0F4780" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(10 1080 1000)">psu</text>
  <text x="50" y="1150" fill="#0F4780" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-4 50 1150)">C_p = 3993 J/(kg·K)</text>
  <text x="550" y="1150" fill="#F14343" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(14 550 1150)">Ra = g β ΔT L³ / (ν κ)</text>
  <text x="950" y="1150" fill="#FFCC00" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-11 950 1150)">Ekman Spiral</text>

  <!-- Particles & Wave Profile Sketches -->
  <circle cx="120" cy="130" r="1.5" fill="#0F4780" opacity="1"/>
  <circle cx="450" cy="90" r="1" fill="#F14343" opacity="1"/>
  <circle cx="780" cy="170" r="2" fill="#FFCC00" opacity="1"/>
  <circle cx="300" cy="300" r="1" fill="#FFCC00" opacity="1"/>

  <!-- Sinusoidal ocean wave sketch -->
  <path d="M 220 440 Q 240 420 260 440 T 300 440 T 340 440" stroke="#0F4780" stroke-width="0.8" fill="none"/>
  <path d="M 220 450 Q 240 430 260 450 T 300 450 T 340 450" stroke="#FFCC00" stroke-width="0.8" fill="none"/>

  <!-- Isobath / Depth contour sketch -->
  <path d="M 820 740 C 850 720, 870 760, 900 740" stroke="#F14343" stroke-width="0.8" fill="none"/>
  <path d="M 820 755 C 850 735, 870 775, 900 755" stroke="#0F4780" stroke-width="0.8" fill="none"/>
</svg>
