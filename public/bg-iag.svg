<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" fill="none">
  <!-- Astronomy, Geophysics & Atmospheric Sciences Equations & Formulas (No Emojis, Pure Math & Blackboard Symbols) -->
  <text x="80" y="60" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-12 80 60)">H₀ = 70 km/s/Mpc</text>
  <text x="650" y="120" fill="#F14343" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(8 650 120)">P_{atm} = 1013 hPa</text>
  <text x="1020" y="80" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-5 1020 80)">M_☉</text>
  <text x="350" y="200" fill="#FFCC00" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(15 350 200)">v_{esc} = √(2GM/R)</text>
  <text x="900" y="250" fill="#0F4780" opacity="1" font-size="24" font-family="Georgia, serif" transform="rotate(-8 900 250)">g = 9.81 m/s²</text>
  <text x="150" y="340" fill="#F14343" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(6 150 340)">λ_{max} T = b</text>
  <text x="550" y="380" fill="#0F4780" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(-10 550 380)">z = Δλ/λ₀</text>
  <text x="1050" y="400" fill="#FFCC00" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(12 1050 400)">T = 2π√(a³/GM)</text>
  <text x="80" y="500" fill="#FFCC00" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(-6 80 500)">1 AU = 1.496×10¹¹ m</text>
  <text x="400" y="550" fill="#F14343" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(9 400 550)">F = G m₁m₂ / r²</text>
  <text x="750" y="520" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-15 750 520)">∂p/∂z = -ρg</text>
  <text x="200" y="680" fill="#0F4780" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(4 200 680)">v_g = -(1/fρ) ∇p</text>
  <text x="600" y="720" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-7 600 720)">1 pc = 3.26 ly</text>
  <text x="1000" y="650" fill="#F14343" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(11 1000 650)">L_☉</text>
  <text x="100" y="850" fill="#F14343" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(-9 100 850)">S₀ = 1361 W/m²</text>
  <text x="480" y="900" fill="#0F4780" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(7 480 900)">α, δ (RA/Dec)</text>
  <text x="850" y="870" fill="#FFCC00" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-13 850 870)">θ = 1.22 λ/D</text>
  <text x="300" y="1050" fill="#FFCC00" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(5 300 1050)">∇²Φ = 4πGρ</text>
  <text x="700" y="1080" fill="#F14343" opacity="1" font-size="14" font-family="Georgia, serif" transform="rotate(-8 700 1080)">M_V = m_v - 5 log(d/10)</text>
  <text x="1080" y="1000" fill="#0F4780" opacity="1" font-size="20" font-family="Georgia, serif" transform="rotate(10 1080 1000)">r_s = 2GM/c²</text>
  <text x="50" y="1150" fill="#0F4780" opacity="1" font-size="16" font-family="Georgia, serif" transform="rotate(-4 50 1150)">T_{eff} = 5778 K</text>
  <text x="550" y="1150" fill="#F14343" opacity="1" font-size="18" font-family="Georgia, serif" transform="rotate(14 550 1150)">F = σ T⁴</text>
  <text x="950" y="1150" fill="#FFCC00" opacity="1" font-size="22" font-family="Georgia, serif" transform="rotate(-11 950 1150)">Ω_☉</text>

  <!-- Tiny dots & Celestial Orbital Sketch Lines -->
  <circle cx="120" cy="130" r="1.5" fill="#0F4780" opacity="1"/>
  <circle cx="450" cy="90" r="1" fill="#F14343" opacity="1"/>
  <circle cx="780" cy="170" r="2" fill="#FFCC00" opacity="1"/>
  <circle cx="300" cy="300" r="1" fill="#FFCC00" opacity="1"/>
  <circle cx="950" cy="330" r="1.5" fill="#0F4780" opacity="1"/>
  <circle cx="600" cy="450" r="1" fill="#F14343" opacity="1"/>
  <circle cx="160" cy="600" r="2" fill="#0F4780" opacity="1"/>
  <circle cx="500" cy="650" r="1" fill="#FFCC00" opacity="1"/>

  <!-- Orbital Ellipse Sketch (Kepler Orbit) -->
  <ellipse cx="250" cy="450" rx="32" ry="12" fill="none" stroke="#FFCC00" stroke-width="0.8" transform="rotate(-20 250 450)"/>
  <circle cx="238" cy="450" r="2.5" fill="#F14343"/>
  <circle cx="275" cy="442" r="1.5" fill="#0F4780"/>

  <ellipse cx="850" cy="750" rx="26" ry="9" fill="none" stroke="#0F4780" stroke-width="0.8" transform="rotate(35 850 750)"/>
  <circle cx="850" cy="750" r="2" fill="#FFCC00"/>
</svg>
