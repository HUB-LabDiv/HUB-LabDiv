name: Hub Data Pipeline (Sincronização IFUSP & JúpiterWeb)

on:
  schedule:
    # Execução diária às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar apenas auditoria sem enviar à fila /admin'
        required: false
        default: false
        type: boolean

concurrency:
  group: hub-data-pipeline-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync_to_admin:
    name: Sincronização Diária -> Fila /admin
    # Evita execuções diárias triplicadas nos espelhos pessoais
    if: github.event_name == 'workflow_dispatch' || github.repository == 'HUB-LabDiv/HUB-LabDiv'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup do Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências Python (Enxuto com Cache)
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scraper-v1
      - run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Setup do Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar tsx CLI (Runner Enxuto)
        run: npm install --no-save tsx

      - name: Executar Scrapers (5 Módulos com Retry + Timeout 25s)
        run: |
          python3 scripts/scrapers/scrape_departments.py || true
          python3 scripts/scrapers/scrape_initiatives.py || true
          python3 scripts/scrapers/scrape_events_and_news.py || true
          python3 scripts/scrapers/scrape_spaces.py || true
          python3 scripts/scrapers/scrape_jupiter.py || true

      - name: Enviar Diffs Canônicos para Fila de Aprovação (/admin)
        env:
          HUB_SYNC_API_URL: ${{ vars.HUB_SYNC_API_URL || 'https://www.hublabdiv.com.br' }}
          DATA_PIPELINE_SECRET: ${{ secrets.DATA_PIPELINE_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/scrapers/stage_to_admin.ts --dry-run
          else
            npx tsx scripts/scrapers/stage_to_admin.ts
          fi
