<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUB LabDiv — Modo Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --cyan: #1F9FCF;
      --navy: #0F4780;
      --yellow: #FFCC00;
      --red: #F14343;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.12);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      padding: 32px 28px;
      border-radius: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .bars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 18px;
    }
    .bar { height: 6px; width: 34px; border-radius: 999px; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(241, 67, 67, 0.14);
      color: var(--red);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px;
      font-weight: 800;
    }
    p {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 24px;
    }
    button {
      min-height: 48px;
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--navy), var(--cyan));
      color: #ffffff;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="bars" aria-hidden="true">
      <span class="bar" style="background: var(--cyan);"></span>
      <span class="bar" style="background: var(--red);"></span>
      <span class="bar" style="background: var(--yellow);"></span>
    </div>
    <div class="badge">Sem Conexão • HUB LabDiv</div>
    <h1>Você está offline no momento</h1>
    <p>
      Não foi possível conectar ao servidor do HUB LabDiv (IFUSP). Seus lembretes locais e a fila
      de transferências continuam preservados e serão retomados assim que a rede voltar.
    </p>
    <button type="button" onclick="window.location.href='https://www.hublabdiv.com.br'">
      Tentar novamente
    </button>
  </div>
</body>
</html>
